version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable:
        - nilness
        - unusedwrite
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
          - rowserrcheck
          - sqlclosecheck

formatters:
  enable:
    - gofmt
