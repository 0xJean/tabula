services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tabula_demo
      POSTGRES_PASSWORD: local_demo_admin
    ports:
      - "127.0.0.1:${TABULA_DEMO_PORT:-55432}:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tabula_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
