<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C4A2D"/><stop offset="1" stop-color="#4A2A18"/></linearGradient>
<linearGradient id="wax" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2937"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#D97706"/></linearGradient>
</defs>
<rect width="200" height="200" rx="44" fill="#F7F3EA"/>
<!-- two hinged panels -->
<g transform="rotate(-6 100 100)">
<rect x="28" y="44" width="70" height="112" rx="10" fill="url(#wood)"/>
<rect x="38" y="54" width="50" height="92" rx="5" fill="url(#wax)"/>
<rect x="102" y="44" width="70" height="112" rx="10" fill="url(#wood)"/>
<rect x="112" y="54" width="50" height="92" rx="5" fill="url(#wax)"/>
<circle cx="100" cy="72" r="4" fill="url(#gold)"/><circle cx="100" cy="128" r="4" fill="url(#gold)"/>
<!-- carved grid: header + rows -->
<path d="M44 70h38M44 86h38M44 102h38M44 118h24" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
<path d="M118 70h38" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
<path d="M137 78v54" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- stylus -->
<g transform="rotate(38 140 140)">
<rect x="132" y="84" width="10" height="86" rx="5" fill="url(#gold)"/>
<path d="M132 170 L137 186 L142 170 Z" fill="#92400E"/>
<rect x="130" y="84" width="14" height="10" rx="3" fill="#B45309"/>
</g>
</svg>
