name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: tabula
          POSTGRES_PASSWORD: tabula
          POSTGRES_DB: tabula
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabula"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TABULA_TEST_DSN: postgres://tabula:tabula@localhost:5432/tabula?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: Use the three modules in this checkout
        run: scripts/workspace.sh
      - name: Test both modules against PostgreSQL and enforce coverage floor
        run: |
          for module in . pgxdriver; do
            (
              cd "$module"
              go vet -tags=integration ./...
              go test -race -count=1 -tags=integration -coverprofile=coverage.out ./...
              total=$(go tool cover -func=coverage.out | tail -1)
              echo "### $module" >> "$GITHUB_STEP_SUMMARY"
              echo "$total" >> "$GITHUB_STEP_SUMMARY"
              pct=$(awk '{ sub(/%/, "", $3); print $3 }' <<< "$total")
              awk -v p="$pct" -v f=75 'BEGIN { exit (p + 0 < f + 0) ? 1 : 0 }' || {
                echo "Coverage for $module (${pct}%) fell below floor (75%)" >&2
                exit 1
              }
            )
          done
      - uses: actions/upload-artifact@v4
        if: matrix.postgres == '17'
        with:
          name: coverage-go-${{ matrix.go }}
          path: |
            coverage.out
            pgxdriver/coverage.out
      - name: Smoke test the comparison benchmark
        if: matrix.postgres == '17'
        working-directory: benchmarks
        run: go test -run='^$' -bench=. -benchtime=1x -benchmem
      - name: Run multitenant RLS example end-to-end
        if: matrix.postgres == '17'
        run: |
          psql "$TABULA_TEST_DSN" -c "CREATE DATABASE tabula_demo;"
          psql "postgres://tabula:tabula@localhost:5432/tabula_demo?sslmode=disable" -f examples/multitenant/migrations/001_notes.sql
          TABULA_DEMO_PORT=5432 go run ./examples/multitenant

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "pgxdriver", "benchmarks"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: Use the three modules in this checkout
        run: scripts/workspace.sh
      - name: Run static and dependency-boundary gates
        if: matrix.module == '.'
        run: scripts/check.sh --static
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --build-tags=integration
      - name: Check reachable vulnerabilities
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck -test -tags=integration ./...
      - name: Fuzz parsers and SQL guards
        if: matrix.module == '.'
        run: |
          for target in FuzzParseColumnTag FuzzFilterAnd FuzzOrderSpecResolve FuzzGuardNoSessionEscape; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=1s .
          done
          go test -run='^$' -fuzz='^FuzzParseSnapshot$' -fuzztime=1s ./sqlcheck
      - name: Verify standalone modules against an unpublished core
        if: matrix.module == '.'
        run: |
          candidate="$(scripts/docs.sh --series).999999"
          scripts/release.sh prepare "$candidate"
          scripts/release.sh verify "$candidate"
